[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sfera_hack"
version = "0.1.0"
description = "Git Meetrics System"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Aleksandr Riabchenko", email = "ra@topopr.tech"},
]


dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "python-dotenv>=1.1.1",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.10",
    "isort>=6.0.1",
    "mypy>=1.17.1",
]


[tool.hatch.build.targets.wheel]
packages = ["sfera_hack"]

[tool.hatch.build.targets.sdist]
include = [
    "/sfera_hack",
    "/README.md",
]


[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
known_first_party = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
